name: alterra-dev

# Trois modes documentés dans README.md :
# - Dev hybride     : `docker compose up -d postgres redis minio` + `npm run dev` (hot-reload)
# - Stack complète  : `docker compose up -d` (postgres, redis, minio, api)
# - App complète     : `docker compose --profile full up -d --build` (+ admin, pwa conteneurisés)
#
# Les frontends admin/pwa ne démarrent qu'avec `--profile full` : ils sont buildés
# depuis leurs Dockerfile (Vite → nginx) et servis avec un proxy /api → conteneur `api`.

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      LOG_LEVEL: debug
      DATABASE_URL: postgresql://alterra:alterra_dev@postgres:5432/alterra
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: alterra_admin
      MINIO_SECRET_KEY: alterra_dev_secret
      MINIO_BUCKET_PHOTOS: photos-pointages
      MINIO_BUCKET_REPORTS: rapports-pdf
      JWT_SECRET: change-me-256-bits-minimum-dev-only-secret-value
      JWT_REFRESH_SECRET: change-me-256-bits-minimum-dev-only-refresh-secret
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      ADMIN_ORIGIN: http://localhost:5173
      PWA_ORIGIN: http://localhost:5174
      MAX_UPLOAD_SIZE_MB: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  admin:
    profiles: ["full"]
    build:
      context: .
      dockerfile: admin/Dockerfile
      target: runtime
    restart: unless-stopped
    ports:
      - "5173:80"
    volumes:
      - ./admin/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

  pwa:
    profiles: ["full"]
    build:
      context: .
      dockerfile: pwa/Dockerfile
      target: runtime
    restart: unless-stopped
    ports:
      - "5174:80"
    volumes:
      - ./pwa/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: alterra
      POSTGRES_USER: alterra
      POSTGRES_PASSWORD: alterra_dev
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alterra"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: alterra_admin
      MINIO_ROOT_PASSWORD: alterra_dev_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  redis_data:
  minio_data:
