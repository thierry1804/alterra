name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build-push:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, admin, pwa]
        include:
          - app: api
            dockerfile: backend/Dockerfile
            context: .
          - app: admin
            dockerfile: admin/Dockerfile
            context: .
          - app: pwa
            dockerfile: pwa/Dockerfile
            context: .
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/alterra-${{ matrix.app }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/alterra-${{ matrix.app }}:latest

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: production # requires manual approval — configure in repo settings
    steps:
      - uses: actions/checkout@v4

      - name: Deploy over the tunnel (Cloudflare Access / WireGuard SSH)
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          SSH_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "cd /opt/alterra/infra && TAG=${{ github.sha }} ./scripts/deploy.sh"
