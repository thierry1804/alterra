# Conf nginx pour le mode Docker full local (profil `full` du docker-compose.yml).
# Identique à nginx.static.conf mais avec un proxy /api → conteneur `api`,
# car en local il n'y a pas le nginx de tête de infra/ pour router l'API.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Résolution DNS différée à la requête (resolver Docker) : évite le
        # crash nginx « host not found in upstream » si `api` n'est pas encore
        # résolvable au démarrage.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream api;
        proxy_pass http://$api_upstream:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
