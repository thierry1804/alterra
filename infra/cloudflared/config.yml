# Cloudflare Tunnel — no inbound port opened on the ALTERRA site router.
# Setup (one-time, on the production host):
#   cloudflared tunnel login
#   cloudflared tunnel create alterra-prod
#   cloudflared tunnel route dns alterra-prod app.alterra.mg
#   cloudflared tunnel route dns alterra-prod admin.alterra.mg
# Credentials file path below is generated by `tunnel create`.

tunnel: alterra-prod
credentials-file: /etc/cloudflared/alterra-prod.json

ingress:
  - hostname: app.alterra.mg
    service: https://nginx:443
    originRequest:
      noTLSVerify: true # self-signed/internal cert between cloudflared and nginx
  - hostname: admin.alterra.mg
    service: https://nginx:443
    originRequest:
      noTLSVerify: true
  - service: http_status:404
