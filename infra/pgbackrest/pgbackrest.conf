[global]
repo1-path=/var/lib/pgbackrest
repo1-retention-full=2
repo1-retention-diff=14
process-max=2
log-level-console=info
log-level-file=detail
start-fast=y

[alterra]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-socket-path=/var/run/postgresql

# Schedule (host crontab, not in-container):
#   0 2 * * 0   pgbackrest --stanza=alterra --type=full backup     # hebdo, dimanche 02h
#   0 2 * * 1-6 pgbackrest --stanza=alterra --type=incr backup     # incrémental quotidien
# WAL archiving is continuous via archive_command in postgresql.conf:
#   archive_command = 'pgbackrest --stanza=alterra archive-push %p'
#   archive_mode = on
