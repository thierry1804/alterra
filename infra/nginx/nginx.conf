# TLS terminates here (Let's Encrypt certs, renewed by certbot on the host or a
# sidecar). Works whether traffic arrives via Cloudflare Tunnel (cloudflared
# proxies to https://localhost) or via direct IP + port-forward.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain application/json application/javascript text/css;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # --- app.alterra.mg : PWA terrain --------------------------------------
    server {
        listen 80;
        server_name app.alterra.mg;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name app.alterra.mg;

        ssl_certificate     /etc/letsencrypt/live/app.alterra.mg/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.alterra.mg/privkey.pem;
        ssl_protocols       TLSv1.3;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location /api/ {
            proxy_pass http://api:3001/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://pwa-static:80;
            proxy_set_header Host $host;
        }
    }

    # --- admin.alterra.mg : back-office -------------------------------------
    server {
        listen 80;
        server_name admin.alterra.mg;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name admin.alterra.mg;

        ssl_certificate     /etc/letsencrypt/live/admin.alterra.mg/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/admin.alterra.mg/privkey.pem;
        ssl_protocols       TLSv1.3;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location /api/ {
            proxy_pass http://api:3001/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://admin-static:80;
            proxy_set_header Host $host;
        }
    }
}
