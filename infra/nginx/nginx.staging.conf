worker_processes auto;

events {
    worker_connections 512;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    gzip on;

    server {
        listen 443 ssl;
        http2 on;
        server_name staging.alterra.mg;

        ssl_certificate     /etc/letsencrypt/live/staging.alterra.mg/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/staging.alterra.mg/privkey.pem;

        location /api/ {
            proxy_pass http://api:3001/api/;
            proxy_set_header Host $host;
        }

        location /socket.io/ {
            proxy_pass http://api:3001/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
        }

        location /admin/ {
            proxy_pass http://admin-static:80/;
        }

        location / {
            proxy_pass http://pwa-static:80;
        }
    }
}
